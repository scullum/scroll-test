<!DOCTYPE html>
<html>
  <head>
    <title>Parcel Sandbox</title>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto+Mono:wght@400;700&family=Poppins:wght@400;700&family=Merriweather:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"
      integrity="sha512-gmwBmiTVER57N3jYS3LinA9eb8aHrJua5iQD7yqYCKa5x6Jjc7VDVaEA0je0Lu0bP9j7tEjV3+1qUm6loO99Kw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/ScrollTrigger.js" />
  </head>

  <body>
    <div id="app">
      <canvas id="hero-lightpass" />
      
      <section class="page page-1">
        <div class="content">
          <h1>Page One</h1>
          <p>Elegant serif typography with Playfair Display</p>
        </div>
      </section>
      
      <section class="page page-2">
        <div class="content">
          <h1>Page Two</h1>
          <p>Monospace coding style with Roboto Mono</p>
        </div>
      </section>
      
      <section class="page page-3">
        <div class="content">
          <h1>Page Three</h1>
          <p>Modern sans-serif with Poppins</p>
        </div>
      </section>
      
      <section class="page page-4">
        <div class="content">
          <h1>Page Four</h1>
          <p>Classic readability with Merriweather</p>
        </div>
      </section>
      
      <section class="page page-5">
        <div class="content">
          <h1>Page Five</h1>
          <p>Geometric and bold with Space Grotesk</p>
        </div>
      </section>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
